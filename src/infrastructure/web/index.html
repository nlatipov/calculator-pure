<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор - Clean Architecture</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Калькулятор</h1>
    </header>

    <main>
      <form id="calculator-form" class="calculator">
        <div class="input-group">
          <label for="operand1">Первое число</label>
          <input type="number" id="operand1" placeholder="Введите число" step="any" required>
        </div>

        <div class="input-group">
          <label for="operation">Операция</label>
          <select id="operation">
            <option value="add">➕ Сложение (+)</option>
            <option value="subtract">➖ Вычитание (−)</option>
            <option value="multiply">✖️ Умножение (×)</option>
            <option value="divide">➗ Деление (÷)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="operand2">Второе число</label>
          <input type="number" id="operand2" placeholder="Введите число" step="any" required>
        </div>

        <button type="submit" id="calculate" class="btn-calculate">
          Вычислить
        </button>
      </form>

      <div id="result" class="result"></div>
    </main>

  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
